[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-advanced-auth"
version = "0.1.2"
description = "Advanced JWT authentication for Flask with multi-rule support, token tracking, and blacklisting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Waheed", email = "" },
]
keywords = [
    "flask",
    "jwt",
    "authentication",
    "auth",
    "token",
    "blacklist",
    "flask-sqlalchemy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "flask>=2.3.0",
    "flask-sqlalchemy>=3.0.0",
    "PyJWT>=2.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/Wehda23/Flask-Advanced-Authentication"
Repository = "https://github.com/Wehda23/Flask-Advanced-Authentication"
"Bug Tracker" = "https://github.com/Wehda23/Flask-Advanced-Authentication/issues"

[tool.hatch.build.targets.wheel]
packages = ["flask_advanced_auth"]

[tool.hatch.build.targets.sdist]
include = [
    "/flask_advanced_auth",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=flask_advanced_auth --cov-report=term-missing --cov-report=html -v"

# ── Coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["flask_advanced_auth"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ── Black ──────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# ── isort ─────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
